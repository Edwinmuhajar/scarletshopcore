name: Build ScarletShopCore

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ScarletShopCore
          path: target/ScarletShopCore-*.jar
          if-no-files-found: error
      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ScarletShopCore-*.jar
